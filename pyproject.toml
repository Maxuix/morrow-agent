[project]
name = "morrow-agent"
version = "0.1.0"
description = "Morrow — a workspace-aware conversational continuity prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16,<4",
  "keyring>=25,<26",
  "openai>=1.50,<2",
  "prompt-toolkit>=3.0.47,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<14",
  "typer>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrow"]

[project.scripts]
morrow = "morrow.interfaces.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "live: explicit network and real-provider smoke tests (excluded by default)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
